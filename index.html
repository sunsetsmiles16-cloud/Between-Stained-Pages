<script>
    const SUPABASE_URL = "https://lowxjyvlwmscakumpxht.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fngegDh8DniH9zJAPpchGA_jVQkiLr-";
    
    let supabase = null;
    let wakeLock = null;

    const defaultBinders = ["All", "Desserts", "Mains", "Sunday Bakes", "Appetizers"];
    
    const defaultPantryPresets = [
        { id: "p-1", name: "Eggs", category: "Dairy & Refrigerated", stocked: true },
        { id: "p-2", name: "Milk", category: "Dairy & Refrigerated", stocked: true },
        { id: "p-3", name: "Butter", category: "Dairy & Refrigerated", stocked: true },
        { id: "p-4", name: "All-Purpose Flour", category: "Baking", stocked: true },
        { id: "p-5", name: "Granulated Sugar", category: "Baking", stocked: true },
        { id: "p-6", name: "Salt", category: "Spices & Pantry", stocked: true },
        { id: "p-7", name: "Olive Oil", category: "Oils & Vinegars", stocked: true }
    ];

    const commonSubstitutions = [
        { item: "Sour Cream", sub: "Greek Yogurt", ratio: "1:1 ratio", note: "Plain Greek yogurt mimics the tang and thickness perfectly." },
        { item: "Buttermilk", sub: "Milk + Lemon Juice", ratio: "1 cup milk + 1 tbsp lemon juice/vinegar", note: "Let sit for 5 minutes before using." },
        { item: "Mayonnaise", sub: "Greek Yogurt or Sour Cream", ratio: "1:1 ratio", note: "Great for lighter dressings or salads." },
        { item: "Eggs (for baking)", sub: "Applesauce or Mashed Banana", ratio: "1/4 cup per egg", note: "Adds moisture and natural sweetness in cakes and muffins." },
        { item: "Honey", sub: "Maple Syrup or Agave Nectar", ratio: "1:1 ratio", note: "Direct liquid swap in dressings and marinades." },
        { item: "Soy Sauce", sub: "Tamari or Worcestershire Sauce", ratio: "1:1 ratio", note: "Tamari provides a gluten-free alternative." },
        { item: "Heavy Cream", sub: "Milk + Melted Butter", ratio: "3/4 cup milk + 1/4 cup melted butter", note: "Whisk thoroughly for soups and sauces." },
        { item: "Sugar", sub: "Maple Syrup or Honey", ratio: "3/4 cup liquid sweetener per 1 cup sugar", note: "Reduce other liquids in recipe slightly." }
    ];

    let currentUserId = localStorage.getItem("currentUserId") || "demo-user";
    let userRecipes = JSON.parse(localStorage.getItem(`recipes_${currentUserId}`)) || [];
    let userBinders = JSON.parse(localStorage.getItem(`binders_${currentUserId}`)) || defaultBinders;
    let userCookbooks = JSON.parse(localStorage.getItem(`cookbooks_${currentUserId}`)) || [];
    let pantryItems = JSON.parse(localStorage.getItem(`pantry_${currentUserId}`)) || defaultPantryPresets;
    let userProfile = JSON.parse(localStorage.getItem(`profile_${currentUserId}`)) || { name: "Cook", email: "", avatar: "", wreath: "wreath-flowers", unitSystem: "imperial", fontSizeScale: 1.0 };
    
    let selectedCategory = "All";
    let activeRecipe = null;
    let activeScaleFactor = 1.0;
    let originalServings = 1;
    let authMode = "signUp";
    
    let cookStepIndex = 0;
    let cookTimerInterval = null;
    let cookSecondsElapsed = 0;

    let activeBookEditingId = null;
    let currentSelectedSpineBadge = "🥐";
    let multiScanImages = [null, null, null];
    let pantryFilterCategory = "All";

    function showVintageToast(message, iconName = 'sparkles') {
        const container = document.getElementById('vintageToastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'vintage-toast';
        toast.innerHTML = `<i data-lucide="${iconName}" style="width:1.15rem; height:1.15rem; color:var(--accent-primary); flex-shrink:0;"></i><span>${message}</span>`;
        container.appendChild(toast);
        refreshIcons();
        setTimeout(() => { toast.remove(); }, 3500);
    }

    function safeRun(fn, ...args) {
        try {
            return fn(...args);
        } catch (err) {
            console.error("Execution Error:", err);
            showVintageToast(`Notice: ${err.message || 'Action unavailable.'}`, 'alert-triangle');
        }
    }

    function applyDecadeTheme(era) {
        const allEras = ['1920s', '1930s', '1940s', '1950s', '1960s', '1970s', '1980s', '1990s', '2000s', '2010s'];
        allEras.forEach(e => document.body.classList.remove(`era-${e}`));
        document.body.classList.add(`era-${era}`);
        localStorage.setItem('user_decade_era', era);
        const sSelect = document.getElementById('settingsEraSelect');
        if (sSelect) sSelect.value = era;
    }

    function initDecadeTheme() {
        const savedEra = localStorage.getItem('user_decade_era') || '1970s';
        applyDecadeTheme(savedEra);
    }

    function adjustTextAccessibility(scaleVal) {
        const scale = parseFloat(scaleVal);
        userProfile.fontSizeScale = scale;
        localStorage.setItem(`profile_${currentUserId}`, JSON.stringify(userProfile));
        document.documentElement.style.setProperty('--base-font-size', `${scale}rem`);
        const display = document.getElementById('fontSizeDisplay');
        if (display) display.innerText = `${Math.round(scale * 100)}%`;
    }

    function initApp() {
        try {
            if (window.supabase) supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) { console.warn("Supabase fallback.", e); }

        if (window.innerWidth >= 768) {
            const aside = document.getElementById('desktopSidebar');
            if (aside) aside.style.display = 'block';
        }

        initDecadeTheme();
        renderBinders();
        updateAuthControls();
        updatePantryCounters();
        applyProfileUI();
        renderSubstitutionsList();

        if (userProfile.fontSizeScale) {
            adjustTextAccessibility(userProfile.fontSizeScale);
        }

        handleHashChange();
        window.addEventListener('hashchange', handleHashChange);
        refreshIcons();
    }

    function refreshIcons() {
        if (window.lucide && typeof lucide.createIcons === 'function') {
            lucide.createIcons();
        } else {
            setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 150);
        }
    }

    function navigate(route) {
        window.location.hash = route;
    }

    function handleHashChange() {
        const hash = window.location.hash.replace('#', '') || 'feed';
        if (hash.startsWith('detail=')) {
            const id = hash.split('=')[1];
            viewRecipeDetail(id, false);
            return;
        }
        showSection(hash, false);
    }

    // FIXED ROBUST VIEW ROUTER
    function showSection(sectionId, updateHash = true) {
        if (updateHash) window.location.hash = sectionId;

        const sections = ['feed', 'bookshelf', 'settings', 'substitutions', 'import', 'pantry', 'detail', 'cook'];
        sections.forEach(sec => {
            const el = document.getElementById(`section-${sec}`);
            if (el) {
                if (sec === sectionId) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            }
        });

        // Highlight active nav buttons
        document.querySelectorAll('.sidebar-btn').forEach(btn => {
            btn.style.background = 'transparent';
            btn.style.color = 'var(--text-muted)';
            btn.style.fontWeight = '700';
        });
        document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
            btn.style.color = 'var(--text-muted)';
        });

        const sideBtn = document.getElementById(`btn-${sectionId}`);
        const mobBtn = document.getElementById(`mbtn-${sectionId}`);
        if (sideBtn) {
            sideBtn.style.background = 'var(--bg-tint)';
            sideBtn.style.color = 'var(--accent-primary)';
            sideBtn.style.fontWeight = '800';
        }
        if (mobBtn) mobBtn.style.color = 'var(--accent-primary)';

        if (sectionId === 'feed') renderRecipes();
        else if (sectionId === 'bookshelf') renderBookshelf();
        else if (sectionId === 'substitutions') renderSubstitutionsList();
        else if (sectionId === 'pantry') renderPantry();
        
        refreshIcons();
    }

    function renderBookshelf() {
        const bookcase = document.getElementById('bookcaseDisplay');
        if (!bookcase) return;
        bookcase.innerHTML = '';

        const shelfRow = document.createElement('div');
        shelfRow.className = 'bookshelf-row';

        const addCard = document.createElement('div');
        addCard.className = 'brass-add-card';
        addCard.onclick = () => safeRun(openCookbookCreatorModal);
        addCard.innerHTML = `
            <i data-lucide="plus-circle" style="width: 1.35rem; height: 1.35rem;"></i>
            <span style="font-size: 0.6rem; font-weight: 800; text-transform: uppercase; text-align: center;">New Volume</span>
        `;
        shelfRow.appendChild(addCard);

        userCookbooks.forEach(book => {
            const recipesInBook = userRecipes.filter(r => (book.recipeIds || []).includes(r.id) || r.binder_category === book.title);
            const recipeCount = recipesInBook.length;
            const width = Math.min(68, Math.max(42, 40 + recipeCount * 3));

            const spine = document.createElement('div');
            spine.className = 'cookbook-spine';
            spine.style.width = `${width}px`;
            spine.style.backgroundColor = book.color || '#C2785C';
            spine.onclick = () => safeRun(pullCookbook, book);

            spine.innerHTML = `
                <div class="spine-badge">${book.badge || '🥐'}</div>
                <div class="spine-title-vertical" style="color: ${book.fontColor || '#FFFFFF'};">${book.title}</div>
                <div style="font-size: 0.58rem; color: ${book.fontColor || '#FFFFFF'}; opacity: 0.8; text-align: center; font-weight: 700;">${recipeCount} rec</div>
                <div class="spine-ribbon" style="background: ${book.color === '#C2785C' ? '#D4A373' : '#C2785C'};"></div>
            `;
            shelfRow.appendChild(spine);
        });

        const ledge = document.createElement('div');
        ledge.className = 'shelf-ledge';
        shelfRow.appendChild(ledge);

        bookcase.appendChild(shelfRow);
        refreshIcons();
    }

    function pullCookbook(book) {
        if (book.era) applyDecadeTheme(book.era);
        selectedCategory = book.title;
        renderBinders();
        navigate('feed');
    }

    function renderBinders() {
        const list = document.getElementById('bindersList');
        if (!list) return;
        list.innerHTML = '';

        userBinders.forEach(cat => {
            const isSelected = selectedCategory === cat;
            const btn = document.createElement('button');
            btn.className = "category-chip";
            btn.style.cssText = `padding: 0.35rem 0.85rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 800; white-space: nowrap; transition: all 0.15s ease; ${
                isSelected 
                    ? 'background: var(--accent-primary); color: #fff; border: 1.5px solid var(--accent-primary); box-shadow: 0 2px 6px rgba(0,0,0,0.12);' 
                    : 'background: var(--bg-tint); color: var(--text-primary); border: 1.5px solid var(--border-primary);'
            }`;
            btn.innerText = cat;
            btn.onclick = () => safeRun(setCategory, cat);
            list.appendChild(btn);
        });

        const addBtn = document.createElement('button');
        addBtn.style.cssText = "padding: 0.35rem 0.75rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 800; background: var(--accent-secondary); color: #fff; display: flex; align-items: center; gap: 0.25rem; white-space: nowrap; border: 1.5px solid var(--border-primary);";
        addBtn.innerHTML = `<i data-lucide="folder-plus" style="width: 0.85rem; height: 0.85rem;"></i><span>+ Binder</span>`;
        addBtn.onclick = () => safeRun(openCookbookCreatorModal);
        list.appendChild(addBtn);

        refreshIcons();
    }

    function setCategory(cat) {
        selectedCategory = cat;
        renderBinders();
        renderRecipes();
    }

    function filterRecipes() {
        renderRecipes();
    }

    function renderRecipes() {
        const grid = document.getElementById('recipeGrid');
        const empty = document.getElementById('emptyState');
        if (!grid || !empty) return;
        grid.innerHTML = '';

        const search = (document.getElementById('recipeSearch')?.value || '').toLowerCase();
        const filtered = userRecipes.filter(recipe => {
            const matchesSearch = recipe.title.toLowerCase().includes(search) || 
                                  (recipe.description || '').toLowerCase().includes(search) ||
                                  (recipe.binder_category || '').toLowerCase().includes(search);
            const matchesCategory = selectedCategory === "All" || recipe.binder_category === selectedCategory;
            return matchesSearch && matchesCategory;
        });

        if (filtered.length === 0) {
            empty.classList.remove('hidden');
            grid.classList.add('hidden');
            return;
        }

        empty.classList.add('hidden');
        grid.classList.remove('hidden');

        filtered.forEach(recipe => {
            const card = document.createElement('div');
            card.style.cssText = "background: var(--bg-card); border-radius: var(--radius-card); padding: 1.15rem; border: 1.5px solid var(--border-primary); display: flex; flex-direction: column; justify-content: space-between; gap: 0.85rem; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.03);";
            card.onclick = () => safeRun(viewRecipeDetail, recipe.id);

            const count = (recipe.ingredients || []).length;
            const pantryStatusText = count > 0 ? `${count} ingredients` : 'Recipe Card';

            card.innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 0.75rem; min-width: 0;">
                    <div style="height: 8.5rem; width: 100%; border-radius: 0.85rem; overflow: hidden; background: var(--bg-tint); position: relative; border: 1px solid var(--border-primary);">
                        ${recipe.image_url 
                            ? `<img src="${recipe.image_url}" style="width: 100%; height: 100%; object-fit: cover;">`
                            : `<div style="display: flex; height: 100%; align-items: center; justify-content: center; color: var(--text-muted); font-style: italic;">Heirloom Recipe</div>`
                        }
                        <span style="position: absolute; top: 0.55rem; left: 0.55rem; padding: 0.2rem 0.6rem; border-radius: 9999px; background: rgba(255, 255, 255, 0.95); color: var(--text-primary); font-size: 0.55rem; font-weight: 800; text-transform: uppercase;">${recipe.binder_category || 'Sunday Bakes'}</span>
                    </div>
                    <div style="min-width: 0;">
                        <h4 class="font-retro-title" style="font-size: 1.1rem; color: var(--accent-primary); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${recipe.title}</h4>
                        <p style="font-size: 0.7rem; color: var(--text-muted); font-style: italic; margin-top: 0.2rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${recipe.description || ''}</p>
                    </div>
                </div>
                <div style="padding-top: 0.5rem; border-top: 1.5px dashed var(--border-primary); display: flex; align-items: center; justify-content: space-between; font-size: 0.65rem; color: var(--text-muted);">
                    <span style="font-weight: 800; color: var(--text-primary);">${recipe.cook_time || '30m'}</span>
                    <span style="font-weight: 800; padding: 0.15rem 0.5rem; border-radius: 9999px; background: var(--bg-tint); color: var(--accent-secondary);">${pantryStatusText}</span>
                </div>
            `;
            grid.appendChild(card);
        });
        refreshIcons();
    }

    function viewRecipeDetail(id, updateHash = true) {
        const recipe = userRecipes.find(r => r.id === id);
        if (!recipe) { navigate('feed'); return; }
        if (updateHash) window.location.hash = `detail=${id}`;

        activeRecipe = recipe;
        originalServings = recipe.servings || 4;
        activeScaleFactor = 1.0;

        document.getElementById('detailTitle').innerText = recipe.title;
        document.getElementById('detailCategory').innerText = recipe.binder_category || "Sunday Bakes";
        document.getElementById('detailSource').innerText = recipe.source || "Preserved vintage card";
        document.getElementById('detailDescription').innerText = recipe.description || "";
        document.getElementById('scaledServingsCount').innerText = originalServings;

        const imgContainer = document.getElementById('detailImageContainer');
        const imgEl = document.getElementById('detailImg');
        if (recipe.image_url) {
            imgContainer.classList.remove('hidden');
            imgEl.src = recipe.image_url;
        } else {
            imgContainer.classList.add('hidden');
        }

        renderDetailIngredientsAndSteps();
        showSection('detail', false);
    }

    function renderDetailIngredientsAndSteps() {
        const ingList = document.getElementById('detailIngredientsList');
        if (!ingList) return;
        ingList.innerHTML = '';

        (activeRecipe.ingredients || []).forEach(ing => {
            const li = document.createElement('li');
            li.style.cssText = "font-size: 0.78rem; color: var(--text-primary); margin-bottom: 0.4rem;";
            li.innerText = `• ${ing.name || ing.toString()}`;
            ingList.appendChild(li);
        });

        const stepsList = document.getElementById('detailStepsList');
        if (!stepsList) return;
        stepsList.innerHTML = '';
        (activeRecipe.steps || []).forEach((s, idx) => {
            const li = document.createElement('li');
            li.style.cssText = "font-size: 0.78rem; color: var(--text-primary); margin-bottom: 0.6rem; line-height: 1.4;";
            li.innerText = `${idx + 1}. ${s.instruction || s}`;
            stepsList.appendChild(li);
        });
        refreshIcons();
    }

    function renderPantry() {
        const grid = document.getElementById('pantryGrid');
        if (!grid) return;
        grid.innerHTML = '';

        pantryItems.forEach(item => {
            const chip = document.createElement('div');
            chip.style.cssText = `padding: 0.85rem; border-radius: 0.85rem; border: 1.5px solid ${item.stocked ? 'var(--accent-secondary)' : 'var(--border-primary)'}; background: ${item.stocked ? 'var(--bg-tint)' : 'var(--bg-card)'}; display: flex; flex-direction: column; justify-content: space-between; gap: 0.6rem; cursor: pointer;`;
            chip.onclick = () => safeRun(() => {
                item.stocked = !item.stocked;
                localStorage.setItem(`pantry_${currentUserId}`, JSON.stringify(pantryItems));
                renderPantry();
            });
            
            chip.innerHTML = `
                <span style="font-size: 0.72rem; font-weight: 800; color: ${item.stocked ? 'var(--text-primary)' : 'var(--text-muted)'};">${item.name}</span>
                <span style="font-size: 0.52rem; text-transform: uppercase; font-weight: 800; color: var(--accent-primary);">${item.category}</span>
            `;
            grid.appendChild(chip);
        });
        refreshIcons();
    }

    document.addEventListener('DOMContentLoaded', initApp);
</script>
